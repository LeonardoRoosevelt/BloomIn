<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 讓版面能用 env(safe-area-inset-*) 避開瀏海與底部 Home 指示條 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1917" />

    <!-- iOS 加入主畫面：apple-touch-icon 是唯一被採用的圖示來源，manifest icons 會被忽略 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BloomIn" />
    <meta name="format-detection" content="telephone=no" />

    <title>BloomIn 美術班簽到</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
